<!DOCTYPE html>
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="lab.css">
</head>
<body>
    <div class="container">
        <h1>STUDENT EXPENSE TRACKER</h1>

        <div class="total-box">
            <h2>Total Expense: $<span id="total">99999999</span></h2>
        </div>

        <h2>Add Expense</h2>
        <input type="text" id="Name" placeholder="Expense name">
        <input type="number" id="Amount" placeholder="Amount">

        <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Education</option>
            <option>Games</option>
            <option>Other</option>

        </select>

        <button onclick="addExpense()">Add Expense</button>
        <p id="message"></p>

        <h2>Expense List</h2>
        <label>Filter:</label>
        <select id="filter" onchange="showExpenses()">
            <option>All</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Education</option>
            <option>Other</option>
        </select>

        <ul id="expenseList"></ul>
    </div>

    <script src="lab.js"></script>
</body>
</html>
